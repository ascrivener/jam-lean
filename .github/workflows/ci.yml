name: CI

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-${{ hashFiles('PVM/**', 'Tests/**', 'PVM.lean') }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}-

      - name: Generated tables and constants match the pinned paper
        run: scripts/check-tables.sh

      - name: No forbidden constructs
        run: |
          if grep -rnE '\bsorry\b|partial def|implemented_by|native_decide|bv_decide' PVM JAM Services Tests PVM.lean JAM.lean Services.lean; then
            echo "forbidden construct found" >&2; exit 1
          fi

      - name: Build the largest proofs one at a time (each needs most of the runner's memory)
        run: |
          lake build Services.Witness.ErrTail
          lake build Services.Witness.BadPayload
          lake build Services.Witness.EmptyTail
          lake build Services.Witness.EmptyPayload

      - name: Build the model and its theorems
        run: lake build

      - name: Kernel-checked Ψ_H, Y and Ψ_M examples
        run: lake build Tests.Invocation

      - name: Worked proof with the gas-free logic
        run: lake build Tests.LogicExample

      - name: Theorems use only propext, Classical.choice and Quot.sound
        run: lake env lean scripts/CheckAxioms.lean

      - name: Fetch the pinned test vectors
        run: scripts/fetch-vectors.sh

      - name: Vector runner (programs/)
        run: lake build pvmtest

      - name: Block gas checker (programs/ and gas-tests/)
        run: lake build gascheck

      - name: Blake2b vectors
        run: lake build Tests.Blake2bTest

      - name: General host functions
        run: lake build Tests.HostGeneralTest

      - name: Keccak and SHA3 vectors
        run: lake build Tests.KeccakTest

      - name: Refine host functions, Ψ_R and Ψ_I (hand-written; no vectors exist)
        run: lake build Tests.RefineTest

      - name: The vendored witness blob names only the host calls, and has the code facts, its theorems assume
        run: lake build witnesscheck

      - name: The vendored bootstrap blob has the code facts and layout its theorems assume
        run: lake build bootstrapcheck

      - name: the generated bootstrap files are what their generator produces
        run: |
          lake exe genwitnesssteps --service bootstrap code 7463 | diff - Services/Bootstrap/Code.lean
          lake exe genwitnesssteps --service bootstrap blob | diff - Services/Bootstrap/Blob.lean
          lake exe genwitnesssteps --service bootstrap codecheck 7463
          lake exe genwitnesssteps --service bootstrap cut0 38875 BParams 0 2829 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,7,0 WITNESS_CLASS="5,1,9,0;100,3,12,0;2,0,0,0;7,2,15,0;65535,65535,9,0;300,20000,12,0;40000,129,5,0" WITNESS_SBOUND=0,16 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 BTail1 0 1003 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,19,0 WITNESS_CLASS="5,1,16,0;100,3,255,0;65535,65535,136,0;300,20000,96,0;40000,129,25,0;7,2,249,0" WITNESS_SBOUND=16,256 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 BTail2 0 1020 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,259,0 WITNESS_CLASS="5,1,256,0;100,3,4095,0;65535,65535,2176,0;300,20000,1536,0;40000,129,265,0;7,2,4089,0" WITNESS_SBOUND=256,4096 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 BTail3 0 1037 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,4099,0 WITNESS_CLASS="5,1,4096,0;100,3,65535,0;65535,65535,34816,0;300,20000,24576,0;40000,129,4105,0;7,2,65529,0" WITNESS_SBOUND=4096,65536 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 BTail4 0 1054 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,65539,0 WITNESS_CLASS="5,1,65536,0;100,3,1048575,0;65535,65535,557056,0;300,20000,393216,0;40000,129,65545,0;7,2,1048569,0" WITNESS_SBOUND=65536,1048576 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 BTail5 0 1071 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,1048579,0 WITNESS_CLASS="5,1,1048576,0;100,3,16777215,0;65535,65535,8912896,0;300,20000,6291456,0;40000,129,1048585,0;7,2,16777209,0" WITNESS_SBOUND=1048576,16777216 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 BTail6 0 1088 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,16777219,0 WITNESS_CLASS="5,1,16777216,0;100,3,268435455,0;65535,65535,142606336,0;300,20000,100663296,0;40000,129,16777225,0;7,2,268435449,0" WITNESS_SBOUND=16777216,268435456 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 BTail7 0 1105 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,268435459,0 WITNESS_CLASS="5,1,268435456,0;100,3,4294967295,0;65535,65535,2281701376,0;300,20000,1610612736,0;40000,129,268435465,0;7,2,4294967289,0" WITNESS_SBOUND=268435456,4294967296 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 BTail8 0 1122 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,7,33,0,0 WITNESS_CLASS="5,1,9,33,0,7;100,3,300,33,0,255;65535,65535,4294967295,33,0,1;300,20000,70000,33,0,77;40000,129,16,33,0,3" lake exe genwitnesssteps --service bootstrap cut0 35130 GlueY 0 310 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,7,33,0,0 WITNESS_CLASS="5,1,9,33,0,7;100,3,300,33,0,255;65535,65535,4294967295,33,0,1;300,20000,70000,33,0,77;40000,129,16,33,0,3" lake exe genwitnesssteps --service bootstrap cut0 3635 GlueY2 0 35 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,7,33,0,0 WITNESS_CLASS="5,1,9,33,0,7;100,3,300,33,0,255;65535,65535,4294967295,33,0,1;300,20000,70000,33,0,77;40000,129,16,33,0,3" lake exe genwitnesssteps --service bootstrap cut0 20473 OTail 0 1596 every=16 frame out
          WITNESS_WILD=1 WITNESS_INPUT=3,0,7,33,0,0 WITNESS_CLASS="5,1,9,33,0,7;100,3,12,33,0,255;2,0,0,33,0,1;7,2,15,33,0,77;65535,65535,9,33,0,3;300,20000,12,33,0,9" WITNESS_SBOUND=0,16 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 VTail1 0 1120 every=16 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,19,33,0,0 WITNESS_CLASS="5,1,16,33,0,7;100,3,255,33,0,255;65535,65535,136,33,0,1;300,20000,96,33,0,77;40000,129,25,33,0,3;7,2,249,33,0,9" WITNESS_SBOUND=16,256 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 VTail2 0 1137 every=15 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,259,33,0,0 WITNESS_CLASS="5,1,256,33,0,7;100,3,4095,33,0,255;65535,65535,2176,33,0,1;300,20000,1536,33,0,77;40000,129,265,33,0,3;7,2,4089,33,0,9" WITNESS_SBOUND=256,4096 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 VTail3 0 1154 every=15 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,4099,33,0,0 WITNESS_CLASS="5,1,4096,33,0,7;100,3,65535,33,0,255;65535,65535,34816,33,0,1;300,20000,24576,33,0,77;40000,129,4105,33,0,3;7,2,65529,33,0,9" WITNESS_SBOUND=4096,65536 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 VTail4 0 1171 every=15 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,65539,33,0,0 WITNESS_CLASS="5,1,65536,33,0,7;100,3,1048575,33,0,255;65535,65535,557056,33,0,1;300,20000,393216,33,0,77;40000,129,65545,33,0,3;7,2,1048569,33,0,9" WITNESS_SBOUND=65536,1048576 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 VTail5 0 1188 every=15 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,1048579,33,0,0 WITNESS_CLASS="5,1,1048576,33,0,7;100,3,16777215,33,0,255;65535,65535,8912896,33,0,1;300,20000,6291456,33,0,77;40000,129,1048585,33,0,3;7,2,16777209,33,0,9" WITNESS_SBOUND=1048576,16777216 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 VTail6 0 1205 every=15 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,16777219,33,0,0 WITNESS_CLASS="5,1,16777216,33,0,7;100,3,268435455,33,0,255;65535,65535,142606336,33,0,1;300,20000,100663296,33,0,77;40000,129,16777225,33,0,3;7,2,268435449,33,0,9" WITNESS_SBOUND=16777216,268435456 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 VTail7 0 1222 every=15 frame
          WITNESS_WILD=1 WITNESS_INPUT=3,0,268435459,33,0,0 WITNESS_CLASS="5,1,268435456,33,0,7;100,3,4294967295,33,0,255;65535,65535,2281701376,33,0,1;300,20000,1610612736,33,0,77;40000,129,268435465,33,0,3;7,2,4294967289,33,0,9" WITNESS_SBOUND=268435456,4294967296 WITNESS_SIMP=PVM.bitwise_and_m15,PVM.bitwise_and_m7,PVM.bitwise_and_m255 lake exe genwitnesssteps --service bootstrap cut0 35202 VTail8 0 1239 every=15 frame
          test -z "$(git status --porcelain -- Services/Bootstrap)"
          lake exe genwitnesssteps --service bootstrap cut 0 PrefixC 0 600 every=16 frame words
          lake exe genwitnesssteps --service bootstrap run 600 cut=PrefixC | diff - Services/Bootstrap/Prefix.lean
          lake exe genwitnesssteps --service bootstrap memcpy | diff - Services/Bootstrap/Memcpy.lean

      - name: the generated witness files are what their generator produces
        run: |
          lake exe genwitnesssteps code 2835 | diff - Services/Witness/Code.lean
          lake exe genwitnesssteps blob | diff - Services/Witness/Blob.lean
          lake exe genwitnesssteps codecheck 2835
          lake exe genwitnesssteps cut 0 PrefixC 0 702 every=16 frame words
          lake exe genwitnesssteps run 702 cut=PrefixC | diff - Services/Witness/Prefix.lean
          lake exe genwitnesssteps cut 74620 ErrTail 0 1542 every=16 out
          lake exe genwitnesssteps cut0 74620 EmptyTail 0 1445 every=16 out
          lake exe genwitnesssteps cut 23809 Front3 0 275 every=16 frame keep=0,1,5,6,7,8
          lake exe genwitnesssteps cut 23918 Front4 0 68 every=16 frame keep=0,1,2,3,4,5,6,7,12
          lake exe genwitnesssteps cut0 23809 EFront3 0 60 every=16 frame keep=0,1,5,6,7,8
          test -z "$(git status --porcelain -- Services)"
          lake exe genwitnesssteps segx 43495 0 5 Front1 keep=0,1,5,6,7,8 | diff - Services/Witness/Front1.lean
          lake exe genwitnesssteps segx 43514 0 14 Front2 keep=0,1,5,6,7,8 | diff - Services/Witness/Front2.lean

      - name: The real witness binary rejects malformed payloads (a test, not a proof)
        run: lake build witnessrun

      - name: Fetch the Gray Paper v0.8.0 JAM vectors
        run: scripts/fetch-jam-vectors.sh

      - name: Codec vectors (work-package family)
        run: lake build codectest

      - name: Accumulate vectors (all but the listed deviations from GP 0.8.0)
        run: lake build acctest
