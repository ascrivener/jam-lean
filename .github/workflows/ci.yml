name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The proofs run only on demand (Adam, 2026-11-25): Actions > CI > Run workflow, on main or any branch.
  workflow_dispatch:

# One run per PR at a time: a new push cancels the run it replaces. On main, runs are serialized in one
# group and never cancelled: a running main run always finishes and saves its .lake, and the next one
# starts from that cache instead of every run rebuilding the same delta in parallel from an older one.
# GitHub keeps at most one pending run per group (a newer push replaces the pending one), so the latest
# commit on main is always built. The attempts are jobs of the same run, so the group never blocks them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Two lines of jobs (docs/BUILD-INFRA.md):
# * `model` builds PVM, JAM and the tests, and runs every vector suite: minutes, on every run.
# * `attempt-1..3` build and check everything, including the Services proofs: hours when cold. They run
#   only on a manual run (workflow_dispatch). Pushes and PRs skip them, so a model change that breaks a
#   Services proof shows up at the next manual run. To gate PRs on the proofs again, put back the
#   detector step (`scripts/services-affected.py`) for pull_request events.
# A PR may merge when `model` is green and the attempts are green or skipped.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
    steps:
      - name: Run the proofs? (only on a manual run)
        id: detect
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then a=true; else a=false; fi
          echo "affected=$a" | tee -a "$GITHUB_OUTPUT"

  model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL --retry 5 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # Download the pinned toolchain up front, retrying transient download errors (e.g. HTTP 504).
          for i in 1 2 3 4 5; do
            "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)" && break
            echo "toolchain download failed (attempt $i); retrying" >&2
            sleep $((i * 15))
          done
          "$HOME/.elan/bin/elan" toolchain list | grep -q "$(cut -d: -f2 lean-toolchain)"

      - name: Generated tables and constants match the pinned paper
        run: scripts/check-tables.sh

      - name: Spec modules import no fast module outside the allowlist (docs/fast-paths.md)
        run: python3 scripts/check-fast-imports.py

      - name: No forbidden constructs
        run: |
          if grep -rnE '\bsorry\b|partial def|implemented_by|native_decide|bv_decide' PVM JAM Services Tests PVM.lean JAM.lean Services.lean JamCrypto JamCrypto.lean JamCryptoTest.lean RingTest.lean; then
            echo "forbidden construct found" >&2; exit 1
          fi

      # The model's own cache (saved by main's model job), else the newest full build of this toolchain.
      - name: Restore .lake
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-model-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-model-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build the model and its theorems (everything but Services)
        run: lake build PVM JAM

      - name: Kernel-checked Ψ_H, Y and Ψ_M examples
        run: lake build Tests.Invocation

      - name: Worked proof with the gas-free logic
        run: lake build Tests.LogicExample

      - name: Theorems use only propext, Classical.choice and Quot.sound (PVM, JAM and JamCrypto)
        run: lake build JamCrypto && lake env lean scripts/CheckAxiomsModel.lean

      - name: JamCrypto vectors (Ed25519, Bandersnatch IETF / Thin / Pedersen VRF)
        run: lake build cryptotest && .lake/build/bin/cryptotest

      - name: JamCrypto ring root and ring VRF vectors
        run: lake build ringtest && .lake/build/bin/ringtest

      - name: Fetch the pinned test vectors
        run: scripts/fetch-vectors.sh

      - name: Vector runner (programs/)
        run: lake build pvmtest

      - name: Block gas checker (programs/ and gas-tests/)
        run: lake build gascheck

      - name: Blake2b vectors
        run: lake build Tests.Blake2bTest

      - name: General host functions
        run: lake build Tests.HostGeneralTest

      - name: Keccak and SHA3 vectors
        run: lake build Tests.KeccakTest

      - name: SHA-512 vectors (FIPS 180-2 and hashlib) and one trace block's VRF output
        run: lake build Tests.Sha512Test

      - name: Refine host functions, Ψ_R and Ψ_I (hand-written; no vectors exist)
        run: lake build Tests.RefineTest

      - name: Auditing scenarios, §17 (hand-built; no vectors exist)
        run: lake build Tests.AuditingTest

      - name: Constant-depth Merkle trees, J_x, L_x and paged proofs (hand-written; no vectors exist)
        run: lake build Tests.SegmentsTest

      - name: Work-package refinement, §14 — B, A, I, Ξ and the bundle checks (hand-built; no vectors exist)
        run: lake build Tests.GuaranteeTest

      - name: The real witness binary rejects malformed payloads (a test, not a proof)
        run: lake build witnessrun

      - name: Fetch the Gray Paper v0.8.0 JAM vectors
        run: scripts/fetch-jam-vectors.sh

      - name: Codec vectors, tiny and full (encode from JSON, decode and re-encode)
        run: lake build codectest

      - name: State trie vectors (Appendix D)
        run: lake build trietest

      - name: Shuffle vectors (Appendix F)
        run: lake build shuffletest

      - name: Erasure-coding vectors, tiny and full (GP v0.8.1 §H.3)
        run: lake build erasuretest

      # Suspended on gp-v0.8.1 until v0.8.1 vectors exist (docs/gp-v0.8.1-migration.md, "Suspended until
      # v0.8.1 vectors"): the vectors' services are v0.8.0 programs (old host-call ids and registers).
      # The runner is still built; Tests/HostGeneralTest.lean has hand-written v0.8.1 guards meanwhile.
      - name: Accumulate vectors (suspended until v0.8.1 vectors; build only)
        run: lake build acctest-exe

      - name: Recent-history vectors (tiny and full)
        run: lake build historytest

      - name: Authorizations vectors (tiny and full)
        run: lake build authtest

      - name: Statistics vectors (tiny and full)
        run: lake build statstest

      - name: Preimages vectors (tiny and full)
        run: lake build preimagestest

      - name: Disputes vectors (tiny and full)
        run: lake build disputestest

      - name: Assurances vectors (tiny and full)
        run: lake build assurancestest

      - name: Reports vectors (tiny and full)
        run: lake build reportstest

      - name: Safrole vectors (tiny and full; Bandersnatch as an oracle read from the vectors, then JamCrypto's ring VRF)
        run: lake build safroletest

      - name: Fetch four block-import traces (fallback, safrole, storage_light, preimages_light)
        run: scripts/fetch-trace-vectors.sh fallback safrole storage_light preimages_light

      - name: Block import Υ over those traces, state compared after every block
        run: lake build tracetest

      # The restored cache may be a full build; keep the model's cache small by leaving Services out.
      - name: Drop Services from .lake
        if: success() && github.ref == 'refs/heads/main'
        run: rm -rf .lake/build/lib/lean/Services .lake/build/lib/lean/Services.* .lake/build/ir/Services .lake/build/ir/Services.*

      - name: Save .lake
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-model-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

  # A cold build needs more than one job's time: each attempt that runs out of budget saves .lake and the
  # next one resumes from it (see build.yml). Three attempts cover a cold build (about 4.5–5 h of building).
  attempt-1:
    needs: changes
    if: needs.changes.outputs.affected == 'true'
    permissions: { contents: write }  # publish .lake to the lake-cache release (main only)
    uses: ./.github/workflows/build.yml
    with: { attempt: 1, last: false }
  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.timed_out == 'true'
    permissions: { contents: write }  # publish .lake to the lake-cache release (main only)
    uses: ./.github/workflows/build.yml
    with: { attempt: 2, last: false }
  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.timed_out == 'true'
    permissions: { contents: write }  # publish .lake to the lake-cache release (main only)
    uses: ./.github/workflows/build.yml
    with: { attempt: 3, last: true }

  # One check for branch protection: GitHub names a skipped reusable-workflow job `attempt-N` but a run one
  # `attempt-N / build-and-check`, so the attempts can't be required by name. `proofs` always runs and
  # passes exactly when the model job passed and the proofs either weren't needed or finished green
  # (every attempt that ran succeeded, and the last one that ran didn't time out).
  proofs:
    needs: [changes, model, attempt-1, attempt-2, attempt-3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Model and proofs passed
        env:
          AFFECTED: ${{ needs.changes.outputs.affected }}
          CHANGES: ${{ needs.changes.result }}
          MODEL: ${{ needs.model.result }}
          A1: ${{ needs.attempt-1.result }}
          A2: ${{ needs.attempt-2.result }}
          A3: ${{ needs.attempt-3.result }}
          T1: ${{ needs.attempt-1.outputs.timed_out }}
          T2: ${{ needs.attempt-2.outputs.timed_out }}
        run: |
          echo "changes=$CHANGES affected=$AFFECTED model=$MODEL attempts=$A1/$A2/$A3 timed_out=$T1/$T2"
          [ "$CHANGES" = success ] || { echo "changes job did not succeed"; exit 1; }
          [ "$MODEL" = success ] || { echo "model job did not succeed"; exit 1; }
          for r in "$A1" "$A2" "$A3"; do
            case "$r" in success|skipped) ;; *) echo "an attempt ended $r"; exit 1;; esac
          done
          if [ "$AFFECTED" = true ]; then
            [ "$A1" = success ] || { echo "proofs needed but attempt-1 did not run"; exit 1; }
            if [ "$T1" = true ]; then
              [ "$A2" = success ] || { echo "attempt-1 timed out and attempt-2 did not finish"; exit 1; }
              if [ "$T2" = true ]; then
                [ "$A3" = success ] || { echo "attempt-2 timed out and attempt-3 did not finish"; exit 1; }
              fi
            fi
          fi
          echo "ok"
