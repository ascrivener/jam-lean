name: Release
# Creates a tag and a GitHub release at a commit on main. Manual only: Actions -> Release ->
# Run workflow (Claude sessions can trigger it too, after Adam's go-ahead). Tags cannot be pushed
# from Claude cloud sessions, so this is how releases are made.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. gp-v0.8.2)'
        required: true
      target:
        description: 'Full 40-character commit SHA, on main'
        required: true
      title:
        description: 'Release title'
        required: true
      notes:
        description: 'Release notes (markdown)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check inputs
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad tag name: $TAG"; exit 1; }
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target must be a full 40-hex SHA"; exit 1; }
          git merge-base --is-ancestor "$TARGET" origin/main || { echo "::error::$TARGET is not on main"; exit 1; }
          if git ls-remote --exit-code origin "refs/tags/$TAG" > /dev/null; then echo "::error::tag $TAG exists"; exit 1; fi
          if git ls-remote --exit-code origin "refs/heads/$TAG" > /dev/null; then echo "::error::a branch is named $TAG"; exit 1; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES"
